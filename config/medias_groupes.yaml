# Médias français rattachés à leur groupe de propriétaires (D7, recoupement).
#
# Règle D7 : un fait de presse n'est candidat que s'il est rapporté par au moins deux GROUPES
# distincts. Le groupe se lit sur le propriétaire, pas sur une ligne éditoriale supposée :
# c'est un fait vérifiable. Un domaine n'apparaît qu'une fois ; un sous-domaine
# (www., france3-regions.…) suit son domaine parent. Un domaine absent est ignoré.
# En cas de participation croisée, les titres sont rangés dans le même groupe (règle
# prudente : le recoupement devient plus exigeant, jamais plus facile).
#
# Version : 2026-11-10, établie de mémoire par Claude à partir de la carte ci-dessous ;
# chaque changement de propriétaire se note ici (date, source). À vérifier par l'utilisateur.
source: >-
  « Médias français : qui possède quoi ? », Le Monde diplomatique et Acrimed
  (https://www.monde-diplomatique.fr/cartes/PPA), édition la plus récente.

