# Rattachement des textes de report (D1.2) aux scrutins reportés.
#
# Variante demandée pour le dossier des seuils : compter les scrutins reportés plutôt que les
# textes (un même report peut demander une ordonnance, puis un décret, puis une loi).
#
# Règle : un scrutin = un type d'élection + l'année où il devait se tenir, lus dans le titre du
# texte (à défaut, l'année du texte). Un texte qui reporte plusieurs renouvellements nommés
# séparément dans son titre compte pour chacun. Un texte absent de cette table compte comme un
# scrutin à lui seul (`rattachement: a_rattacher`) : il faut alors l'ajouter ici.
#
# Table établie le 2026-11-05 à partir des seuls titres du Journal officiel : à vérifier
# (document de vérification humaine).

textes:
  "2005-1563":
    scrutins: [municipales-2007, cantonales-2007]
    note: « conseillers municipaux et conseillers généraux renouvelables en 2007 ».
  "2013-403":
